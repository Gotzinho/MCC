<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MCC Training">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<title>MCC 2026 — Training</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4f8;--bg2:#e8edf3;--bg3:#dde3eb;--card:#fff;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#0f172a;--text2:#334155;--text3:#64748b;
  --accent:#2563eb;--accent2:#3b82f6;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;--teal:#0891b2;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.05);
  --shadow2:0 2px 8px rgba(15,23,42,.14);
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata',monospace;font-size:13px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* APP SHELL */
#app-header{background:var(--text);color:#fff;padding:calc(var(--safe-top) + 10px) 16px 10px;flex-shrink:0;border-bottom:2px solid var(--accent);position:relative;z-index:20}
#app-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 70px)}
#app-nav{position:fixed;bottom:0;left:0;right:0;background:var(--text);border-top:1px solid #1e293b;padding:6px 0 calc(var(--safe-bottom) + 6px);display:flex;justify-content:space-around;z-index:20}
.nav
