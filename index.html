<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC 2026 — Training Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f4f8;
  --bg2:#e8edf3;
  --bg3:#dde3eb;
  --card:#ffffff;
  --border:#cbd5e1;
  --border2:#94a3b8;
  --text:#0f172a;
  --text2:#334155;
  --text3:#64748b;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --green:#16a34a;
  --green2:#22c55e;
  --amber:#d97706;
  --red:#dc2626;
  --purple:#7c3aed;
  --teal:#0891b2;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.05);
  --shadow2:0 2px 8px rgba(15,23,42,.12);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata',monospace;font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* HEADER */
.hdr{background:var(--text);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--accent)}
.hdr-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;color:#fff}
.hdr-sub{font-size:9px;color:#94a3b8;letter-spacing:3px;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vfcinp{display:flex;align-items:center;gap:6px;font-size:10px;color:#94a3b8;letter-spacing:1px}
.vfcinp input{background:#1e293b;border:1px solid #334155;color:#fff;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:12px;width:65px;outline:none;transition:border-color .15s}
.vfcinp input:focus{border-color:var(--accent2)}
.cdwn{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--accent2);background:#1e293b;padding:4px 12px;border-radius:20px;letter-spacing:1px;border:1px solid #334155}

/* TABS */
.tabs{background:#fff;border-bottom:2px solid var(--border);padding:0 24px;display:flex;overflow-x:auto;box-shadow:0 1px 0 var(--border)}
.tab{padding:11px 16px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--text3);transition:all .2s;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none}
.tab:hover{color:var(--accent)}.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* WEEK BAR */
.wbar{background:#fff;padding:8px 24px;border-bottom:1px solid var(--border);overflow-x:auto}
.wbar-i{display:flex;gap:4px;min-width:max-content}
.wp{padding:4px 9px;border-radius:20px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;color:var(--text3)}
.wp:hover{border-color:var(--border2);color:var(--text2)}.wp.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.content{padding:16px 24px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.mlbl{font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:5px;font-family:'Syne',sans-serif;font-weight:700;text-transform:uppercase}
.mval{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1;margin-bottom:3px}
.msub{font-size:10px;color:var(--text3)}

/* HERO */
.today-hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);color:#fff;border-radius:12px;padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #334155}
.today-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(37,99,235,.2);pointer-events:none}
.today-hero::after{content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:rgba(37,99,235,.1);pointer-events:none}

/* SESSION CARD */
.session-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);transition:box-shadow .2s}
.session-card:hover{box-shadow:var(--shadow2)}
.session-card.intensity-card{border-left:4px solid var(--accent)}
.session-card.rest-card{background:#f8fafc;border-style:dashed}
.session-card.bonus-card{border:2px dashed var(--accent2);background:#eff6ff}
.session-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.session-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--text)}
.session-planned{font-size:11px;color:var(--text3);margin-top:2px}
.session-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-bottom:12px}
.sfield{display:flex;flex-direction:column;gap:4px}
.sfield label{font-size:10px;color:var(--text3);letter-spacing:1px;font-family:'Syne',sans-serif;font-weight:600;text-transform:uppercase}
.sfield input,.sfield select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;font-weight:500;outline:none;transition:border-color .15s;width:100%}
.sfield input:focus,.sfield select:focus{border-color:var(--accent)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-radius:8px;margin-bottom:10px;border:1px solid var(--border)}
.stat-item{text-align:center;min-width:65px}
.stat-val{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;font-family:'Syne',sans-serif;font-weight:600;text-transform:uppercase}

/* TRAINING ZONE */
.zone-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:9px;border:1.5px solid}
.zone-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:9px;background:var(--bg2);border-radius:6px;padding:8px 11px;border:1px solid var(--border)}

/* STEPS */
.steps-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.steps-title{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:10px;text-transform:uppercase}
.step{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:10px;font-weight:800;flex-shrink:0;margin-top:1px}
.step-name{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;margin-bottom:2px}
.step-detail{font-size:11px;color:var(--text3);line-height:1.5}
.step-allure{font-size:11px;font-weight:600;margin-top:2px}

/* READINESS */
.rbar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.rbar-lbl{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:8px;text-transform:uppercase}
.rbar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.rbar-fill{height:100%;border-radius:4px;transition:width .5s}
.rbar-comps{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap;font-size:11px;color:var(--text3)}

/* VFC EXPLANATION */
.vfc-explain{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:11px;color:#1d4ed8;line-height:1.6}

/* AI PANEL */
.ai-panel{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;border:1px solid #334155}
.ai-panel::before{content:'';position:absolute;top:-15px;right:-15px;width:80px;height:80px;border-radius:50%;background:rgba(37,99,235,.15);pointer-events:none}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ai-name{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px}
.ai-sub{font-size:10px;color:#94a3b8}
.ai-content{font-size:11px;color:#cbd5e1;line-height:1.7}
.ai-content strong{color:#fff}
.ai-loading{display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 1.2s infinite}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.ai-btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:1px;margin-top:8px}
.ai-btn:hover{background:var(--accent2)}
.ai-change-box{background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.4);border-radius:8px;padding:9px 12px;margin-top:8px;font-size:11px;color:#bfdbfe;line-height:1.6}

/* FORMS */
input[type=number],select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:12px;outline:none;transition:border-color .15s}
input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{width:68px}
input[type=range]{cursor:pointer;accent-color:var(--accent)}
textarea{resize:vertical;width:100%;min-height:32px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.flbl{font-size:10px;color:var(--text3);letter-spacing:1px;min-width:92px;font-family:'Syne',sans-serif;font-weight:600;text-transform:uppercase}
.fval{font-size:12px;color:var(--text2)}
.divider{border-top:1px solid var(--border);margin:8px 0}
.note-box{background:var(--bg2);border-radius:6px;padding:7px 11px;font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.5;border:1px solid var(--border)}
.warn-box{background:#fffbeb;border-radius:6px;padding:6px 10px;font-size:11px;color:var(--amber);margin-bottom:6px;border-left:3px solid var(--amber)}

/* BANNER */
.banner{border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:12px;border-left:4px solid;display:flex;align-items:center;gap:8px}
.ban-warn{background:#fffbeb;border-color:var(--amber);color:var(--amber)}
.ban-danger{background:#fef2f2;border-color:var(--red);color:var(--red)}
.ban-good{background:#f0fdf4;border-color:var(--green);color:var(--green)}
.ban-info{background:#eff6ff;border-color:var(--accent);color:var(--accent)}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:12px}

/* QUICK SWITCH */
.qs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.qs-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text2);padding:6px 13px;border-radius:8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}
.qs-btn:hover{border-color:var(--accent);color:var(--accent)}.qs-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* CHARTS */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.chart-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;margin-bottom:3px;color:var(--text)}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:12px}
canvas{width:100%!important;display:block}

/* SWAP */
.swap-btn{background:var(--bg2);border:1.5px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:6px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:1px}
.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
.swap-menu{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;box-shadow:var(--shadow2);display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.swap-opt{padding:4px 10px;border-radius:6px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;color:var(--text2)}
.swap-opt:hover{border-color:var(--accent);color:var(--accent)}.swap-opt.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* BONUS BTN */
.bonus-btn{background:transparent;border:2px dashed var(--accent2);color:var(--accent);padding:8px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;letter-spacing:1px}
.bonus-btn:hover{background:var(--accent);color:#fff;border-style:solid}

/* PRED BOX */
.pred-box{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);border-radius:12px;padding:16px 20px;color:#fff;margin-bottom:12px;border:1px solid #334155}
.pred-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:#64748b;margin-bottom:6px;text-transform:uppercase}
.pred-time{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;line-height:1;color:var(--accent2)}
.pred-sub{font-size:11px;color:#94a3b8;margin-top:5px}

/* TABLE */
.otable{width:100%;border-collapse:collapse;font-size:12px}
.otable th{padding:7px 10px;text-align:left;font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text3);border-bottom:2px solid var(--border);text-transform:uppercase}
.otable td{padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.otable tr:hover td{background:var(--bg2)}.otable tr.sr td{background:#eff6ff}

/* MISC */
.paces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.pace-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.export-btn{background:var(--text);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background .2s}
.export-btn:hover{background:var(--accent)}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prog-lbl{font-size:11px;color:var(--text2);min-width:100px;font-family:'Syne',sans-serif;font-weight:600}
.prog-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s}
.prog-val{font-size:11px;color:var(--text3);min-width:90px;text-align:right}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.leg-dot{width:9px;height:9px;border-radius:2px}
h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:1px;margin-bottom:12px;color:var(--text)}
h3{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--text2);margin-bottom:7px;margin-top:14px}
.stitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.pbadge{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;padding:4px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--border)}
@media(max-width:600px){.content{padding:12px 14px}.hdr,.tabs,.wbar{padding-left:14px;padding-right:14px}}
</style>
</head>
<body><div id="app"></div>
<script>
// ══════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════
const VMA=17, WEEKS=19;
const START=new Date("2026-04-13");
const RACE=new Date("2026-08-24");
const SWIM_LAST_WEEK=11; // weeks 0-10 (S1-S11) = swim; from w=11 (S12) = run

function paceStr(pct){if(!pct)return"—";const mpk=60/(VMA*pct),m=Math.floor(mpk),s=String(Math.round((mpk-m)*60)).padStart(2,"0");return`${m}:${s}/km`}
function paceKmh(pct){return+(VMA*pct).toFixed(1)}
function weekDate(w){const d=new Date(START);d.setDate(d.getDate()+(w-1)*7);return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function todayWeek(){return Math.max(1,Math.min(WEEKS,Math.floor((new Date()-START)/(7*86400000))+1))}
function daysLeft(){return Math.max(0,Math.ceil((RACE-new Date())/86400000))}

const PACES={
  récup:{pct:.60,label:"Récup",hex:"#16a34a"},facile:{pct:.70,label:"Facile",hex:"#0891b2"},
  modéré:{pct:.78,label:"Modéré",hex:"#d97706"},seuil:{pct:.88,label:"Seuil",hex:"#ea580c"},
  vma90:{pct:.90,label:"90%VMA",hex:"#dc2626"},vma100:{pct:1.0,label:"100%VMA",hex:"#991b1b"},
  repos:{pct:0,label:"Repos",hex:"#64748b"},
};
const TE={
  récup:{rpe:"RPE 3-4",va:"250–350m/h",desc:"Conversation facile. Marcher montées raides."},
  facile:{rpe:"RPE 4-5",va:"350–450m/h",desc:"Allure confort, légère accélération."},
  modéré:{rpe:"RPE 6",va:"500–650m/h",desc:"Essoufflement contrôlé. Phrases courtes."},
  seuil:{rpe:"RPE 7-8",va:"700–900m/h",desc:"Inconfortable mais tenable."},
  vma90:{rpe:"RPE 8-9",va:">1000m/h",desc:"Très intense. Intervalles courts."},
  vma100:{rpe:"RPE 10",va:"Max",desc:"Sprint côte. <2min par rep."},
};
const TRIMP_F={récup:.5,facile:.7,modéré:1.0,seuil:1.4,vma90:1.6,vma100:2.0,repos:0};
const PHASE_C={Base:"#2563eb",Build:"#d97706",Peak:"#dc2626",Taper:"#7c3aed"};
const PAIN_ZONES=["Aucune","Biceps fémoral G","Biceps fémoral D","Genou G","Genou D","Mollet G","Mollet D","Talon","Autre"];
const TRAINING_ZONES=[
  {name:"Récupération active",color:"#64748b",bg:"#f8fafc",pctVMA:[0,.60],benefit:"Récupération, circulation, élimination déchets métaboliques",garmin:"Zone 1",icon:"💤"},
  {name:"Endurance fondamentale",color:"#0891b2",bg:"#f0f9ff",pctVMA:[.60,.75],benefit:"Développement aérobie, économie de course, oxydation des graisses",garmin:"Zone 2",icon:"🫀"},
  {name:"Tempo / Seuil aérobie",color:"#d97706",bg:"#fffbeb",pctVMA:[.75,.87],benefit:"Repousse le seuil lactique, améliore le tempo, cardio-vasculaire",garmin:"Zone 3",icon:"⚡"},
  {name:"Seuil lactique",color:"#ea580c",bg:"#fff7ed",pctVMA:[.87,.95],benefit:"Tolérance lactique, vitesse au seuil, VO2max indirecte",garmin:"Zone 4",icon:"🔥"},
  {name:"VO2max / Anaérobie",color:"#dc2626",bg:"#fef2f2",pctVMA:[.95,1.2],benefit:"Développe le VO2max, puissance maximale aérobie",garmin:"Zone 5",icon:"🚀"},
];
function getZone(ik){const p=PACES[ik]?.pct||0;for(let i=TRAINING_ZONES.length-1;i>=0;i--)if(p>=TRAINING_ZONES[i].pctVMA[0])return TRAINING_ZONES[i];return TRAINING_ZONES[0]}
const ACTIVITY_TYPES={
  run:{label:"Course",icon:"🏃",trimpMult:1.0,kmPerMin:(ik)=>VMA*(PACES[ik]?.pct||.70)/60},
  trail:{label:"Trail",icon:"⛰️",trimpMult:1.2,kmPerMin:()=>VMA*.55/60},
  bike:{label:"Vélo",icon:"🚴",trimpMult:0.6,kmPerMin:()=>25/60},
  swim:{label:"Natation",icon:"🏊",trimpMult:0.8,kmPerMin:()=>2/60},
  crossfit:{label:"CrossFit",icon:"🏋️",trimpMult:1.0,kmPerMin:()=>0},
  hike:{label:"Rando",icon:"🥾",trimpMult:0.6,kmPerMin:()=>VMA*.45/60},
  rest:{label:"Repos",icon:"😴",trimpMult:0,kmPerMin:()=>0},
};

// ══════════════════════════════════════════════════
// VFC SCORE — fixed formula
// ══════════════════════════════════════════════════
// Score reflects deviation from baseline with realistic sensitivity
// ±5% = normal variation → 80-100
// -10% = moderate drop → ~65
// -20% = significant drop → ~40
function calcVFCScore(vfc, baseline){
  if(!vfc||!baseline) return 100; // no data = assume ok, not penalised
  const ratio = vfc / baseline;
  if(ratio >= 1.05) return 100;          // above baseline = excellent
  if(ratio >= 0.95) return Math.round(80 + (ratio - 0.95) / 0.10 * 20); // 95-105% → 80-100
  if(ratio >= 0.85) return Math.round(60 + (ratio - 0.85) / 0.10 * 20); // 85-95% → 60-80
  if(ratio >= 0.75) return Math.round(35 + (ratio - 0.75) / 0.10 * 25); // 75-85% → 35-60
  return Math.max(10, Math.round(35 * ratio / 0.75));                    // <75% → 10-35
}
function calcSleepScore(sleep, sleepQual){
  if(!sleep) return 100; // no data = no penalty
  const durScore = Math.min(100, Math.max(0, (sleep/9)*100));
  const qualScore = sleepQual ? (sleepQual/5)*100 : 70;
  return Math.round(durScore*.6 + qualScore*.4);
}
function calcMotScore(motivation){
  if(!motivation) return 100; // no data = no penalty
  return Math.round((motivation/5)*100);
}

// ══════════════════════════════════════════════════
// CALCULATIONS
// ══════════════════════════════════════════════════
function calcDayTRIMP(day){
  const dur=day.actualDur!==undefined?day.actualDur:day.dur;
  const baseF=TRIMP_F[day.ik]||1;
  const typeF=ACTIVITY_TYPES[day.type]?.trimpMult??1;
  const plannedF=ACTIVITY_TYPES[day.plannedType]?.trimpMult??1;
  const adjF=day.type!==day.plannedType?(baseF*typeF/Math.max(plannedF,.1)):baseF;
  return Math.round(dur*Math.min(adjF,2.5));
}
function calcBonusTRIMP(bonus){
  if(!bonus||!bonus.type||bonus.type==="rest") return 0;
  const dur=bonus.dur||0;
  const f=TRIMP_F[bonus.ik||"facile"]||.7;
  const tf=ACTIVITY_TYPES[bonus.type]?.trimpMult||1;
  return Math.round(dur*f*tf);
}
function weekTRIMP(week){
  return week.days.reduce((s,d)=>s+calcDayTRIMP(d),0)+(calcBonusTRIMP(week.bonusSession)||0);
}
function calcACWR(plan,wi){
  const acute=weekTRIMP(plan[wi]);
  const past=plan.slice(Math.max(0,wi-4),wi);
  const chronic=past.length?past.reduce((s,w)=>s+weekTRIMP(w),0)/past.length:acute;
  return{acute,chronic:Math.round(chronic),ratio:chronic>0?+(acute/chronic).toFixed(2):1};
}

// FIXED READINESS - no penalty for missing data
function calcReadiness(week,vfcBase){
  // Collect all data points from all days (including rest days)
  const allDays=week.days;
  // VFC: use days where VFC was entered
  const vfcs=allDays.filter(d=>d.vfc>0).map(d=>calcVFCScore(d.vfc,vfcBase));
  const vfcScore=vfcs.length?Math.round(vfcs.reduce((a,b)=>a+b,0)/vfcs.length):100;
  // Sleep
  const sleepScores=allDays.filter(d=>d.sleep>0).map(d=>calcSleepScore(d.sleep,d.sleepQual));
  const sleepScore=sleepScores.length?Math.round(sleepScores.reduce((a,b)=>a+b,0)/sleepScores.length):100;
  // Motivation
  const motScores=allDays.filter(d=>d.motivation>0).map(d=>calcMotScore(d.motivation));
  const motScore=motScores.length?Math.round(motScores.reduce((a,b)=>a+b,0)/motScores.length):100;
  // Weighted: VFC 35% + Sleep 30% + Motivation 35%
  const readiness=Math.round(.35*vfcScore+.30*sleepScore+.35*motScore);
  // Sample values for display
  const vfcs2=allDays.filter(d=>d.vfc>0).map(d=>d.vfc);
  const avgVFC=vfcs2.length?Math.round(vfcs2.reduce((a,b)=>a+b,0)/vfcs2.length):vfcBase;
  const sleeps=allDays.filter(d=>d.sleep>0).map(d=>d.sleep);
  const avgSleep=sleeps.length?+(sleeps.reduce((a,b)=>a+b,0)/sleeps.length).toFixed(1):null;
  const mots=allDays.filter(d=>d.motivation>0).map(d=>d.motivation);
  const avgMot=mots.length?+(mots.reduce((a,b)=>a+b,0)/mots.length).toFixed(1):null;
  return{readiness,vfcScore,sleepScore,motScore,avgVFC,avgSleep,avgMot,
    hasVFC:vfcs.length>0,hasSleep:sleepScores.length>0,hasMot:motScores.length>0};
}

function getAdapt(week,vfcBase){
  const r=calcReadiness(week,vfcBase);
  if(r.readiness<45)return{loadMod:.6,type:"danger",msg:`⚠ Readiness critique (${r.readiness}/100) — charge réduite à 60%.`};
  if(r.readiness<62)return{loadMod:.8,type:"warn",msg:`↓ Readiness faible (${r.readiness}/100) — charge à 80%.`};
  if(r.readiness>85)return{loadMod:1.1,type:"good",msg:`↑ Excellent Readiness (${r.readiness}/100) — +10% possible.`};
  return{loadMod:1,type:"",msg:""};
}
function calcSessionStats(day){
  const dur=day.actualDur!==undefined?day.actualDur:day.dur;
  const km=day.actualKm!==undefined?day.actualKm:+(ACTIVITY_TYPES[day.type]?.kmPerMin(day.ik)*(day.actualDur!==undefined?day.actualDur:day.dur)||0).toFixed(1);
  const speed=dur>0&&km>0?+(km/(dur/60)).toFixed(1):0;
  const dp=day.actualDp!==undefined?day.actualDp:day.dp;
  const vaAsc=dp&&dur>0?Math.round(dp/(dur/60)):0;
  return{dur,km,speed,dp,vaAsc,trimp:calcDayTRIMP(day)};
}
function predictMCC(plan){
  const done=plan.filter(w=>w.days.some(d=>d.actualDur!==undefined));
  if(!done.length)return{min:295,max:340,conf:false};
  const totAD=plan.reduce((s,w)=>s+w.days.reduce((ss,d)=>ss+(d.actualDp||0),0),0);
  const totED=plan.reduce((s,w)=>s+w.days.reduce((ss,d)=>ss+d.dp,0),0);
  const dpR=totED>0?Math.min(1,totAD/totED):0.3;
  return{min:Math.round(310*(1-dpR*.12)*.93),max:Math.round(310*(1-dpR*.12)*1.07),conf:done.length>3};
}
function getWeekStats(plan){
  return plan.map((w,i)=>{
    const expKm=+(w.days.reduce((s,d)=>s+(ACTIVITY_TYPES[d.type]?.kmPerMin(d.ik)*d.dur||0),0).toFixed(1));
    const actKm=w.days.some(d=>d.actualDur!==undefined)?+(w.days.reduce((s,d)=>d.actualKm!==undefined?s+d.actualKm:s+(d.actualDur!==undefined?(ACTIVITY_TYPES[d.type]?.kmPerMin(d.ik)*d.actualDur||0):0),0).toFixed(1)):null;
    const expDp=w.days.reduce((s,d)=>s+d.dp,0);
    const actDp=w.days.some(d=>d.actualDur!==undefined)?w.days.reduce((s,d)=>s+(d.actualDp!==undefined?d.actualDp:d.actualDur!==undefined?d.dp:0),0):null;
    const expMin=w.days.reduce((s,d)=>s+d.dur,0);
    const actMin=w.days.some(d=>d.actualDur!==undefined)?w.days.reduce((s,d)=>s+(d.actualDur||0),0):null;
    const acwr=calcACWR(plan,i),rd=calcReadiness(w,vfcBase);
    return{week:w.week,expKm,actKm,expDp,actDp,expMin,actMin,trimp:weekTRIMP(w),acwr:acwr.ratio,readiness:rd.readiness,hasActual:w.days.some(d=>d.actualDur!==undefined)};
  });
}

// STATE + MIGRATION

let plan=buildPlan(),selWeek=todayWeek(),vfcBase=65,view="today",swapOpen=null,aiLoading=false;

function migrate(saved,fresh){
  // Migrate user data from saved plan to fresh plan structure
  if(!saved||!saved.length) return fresh;
  return fresh.map((fw,wi)=>{
    if(!saved[wi]) return fw;
    const sw=saved[wi];
    return{
      ...fw,
      aiAdvice:sw.aiAdvice||null,
      aiAdviceDate:sw.aiAdviceDate||null,
      bonusSession:sw.bonusSession||null,
      days:fw.days.map((fd,di)=>{
        const sd=sw.days?.[di];
        if(!sd) return fd;
        // Only copy user-entered data, not plan structure
        const userFields=['actualDur','actualKm','actualDp','bpmAvg','vfc','fcRecup','sleep','sleepQual','weight','motivation','fatigue','painZone','painLevel','comment','type','activity'];
        const out={...fd};
        userFields.forEach(k=>{if(sd[k]!==undefined&&sd[k]!==null&&sd[k]!=="")out[k]=sd[k]});
        return out;
      })
    };
  });
}

function save(){try{localStorage.setItem("mcc_v7",JSON.stringify({plan,selWeek,vfcBase,view}))}catch(e){}}
function load(){
  try{
    const s=localStorage.getItem("mcc_v7")||localStorage.getItem("mcc_v6")||localStorage.getItem("mcc_v5")||localStorage.getItem("mcc_v4");
    if(s){
      const d=JSON.parse(s);
      if(d.plan) plan=migrate(d.plan, buildPlan());
      selWeek=d.selWeek||todayWeek();
      vfcBase=d.vfcBase||65;
      view=d.view||"today";
    }
  }catch(e){}
}

async function fetchAIAdvice(wi){
  const week=plan[wi],rd=calcReadiness(week,vfcBase),acwr=calcACWR(plan,wi),adapt=getAdapt(week,vfcBase);
  const stats=getWeekStats(plan),ws=stats[wi],pred=predictMCC(plan);
  const pains=week.days.filter(d=>d.painZone&&d.painZone!=="Aucune").map(d=>`${d.painZone} ${d.painLevel||1}/10 (${d.day})`);
  const swaps=week.days.filter(d=>d.type!==d.plannedType).map(d=>`${d.day}: ${d.plannedType}→${d.type}`);
  const prevW=plan.slice(Math.max(0,wi-3),wi).map(w=>{const s=stats[w.week-1];return`S${w.week}: TRIMP ${weekTRIMP(w)}, ${s.actMin||"?"}/${s.expMin}min`}).join(" | ");
  const bonusInfo=week.bonusSession?`Séance bonus: ${week.bonusSession.type} ${week.bonusSession.dur}min (${week.bonusSession.day})`:"";
  const prompt=`Tu es coach trail expert. Pierre, kiné, VMA 17km/h, Sierre-Zinal 4h30. Objectif MCC 2026 (40km, 2350m D+, 24 août).

SEMAINE ${week.week}/${WEEKS} — ${week.phase}${week.isRec?" (RÉCUP)":""}:
Readiness: ${rd.readiness}/100 (VFC: ${rd.vfcScore}/100 [${rd.avgVFC}ms vs ${vfcBase}ms base], Sommeil: ${rd.sleepScore}/100 [${rd.avgSleep||"?"}h], Motivation: ${rd.motScore}/100 [${rd.avgMot||"?"}/5])
TRIMP: ${weekTRIMP(week)} | AC:CC: ${acwr.ratio} | Adaptation: ${Math.round(adapt.loadMod*100)}%
Volume: ${ws.actMin||"?"}/${ws.expMin}min | Km: ${ws.actKm||"?"}/${ws.expKm} | D+: ${ws.actDp||"?"}/${ws.expDp}m
${pains.length?`DOULEURS: ${pains.join(", ")}`:"Aucune douleur"}
${swaps.length?`Séances modifiées: ${swaps.join(", ")}`:""}${bonusInfo?`\n${bonusInfo}`:""}
Semaines précédentes: ${prevW||"première"}
Prédiction MCC: ${Math.floor(pred.min/60)}h${String(pred.min%60).padStart(2,"0")}-${Math.floor(pred.max/60)}h${String(pred.max%60).padStart(2,"0")} | J-${daysLeft()} avant MCC
Note: Natation remplacée par course récup à partir S12.

Analyse avec recommandations concrètes:
1. État général (2-3 phrases directes)
2. Points d'attention (max 3 bullets)
3. Ajustements cette semaine (séance précise, modification concrète)
4. Conseil semaine suivante (1 phrase)
5. Alerte si besoin

Précis, utilise les données réelles, **gras** pour points clés. Français.`;
  try{
    aiLoading=true;render();
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:prompt}]})});
    const data=await resp.json();
    plan[wi].aiAdvice=data.content?.find(c=>c.type==="text")?.text||"Erreur API.";
    plan[wi].aiAdviceDate=new Date().toLocaleDateString("fr-FR");
  }catch(e){plan[wi].aiAdvice="Erreur de connexion."}
  aiLoading=false;save();render();
}

function render(){
  const wi=selWeek-1,week=plan[wi],adapt=getAdapt(week,vfcBase);
  const acwr=calcACWR(plan,wi),rd=calcReadiness(week,vfcBase);
  const acwrC=acwr.ratio>1.5?"#dc2626":acwr.ratio>1.3?"#d97706":acwr.ratio<.8?"#7c3aed":"#16a34a";
  const acwrL=acwr.ratio>1.5?"⚠ Surcharge":acwr.ratio>1.3?"Attention":acwr.ratio<.8?"Sous-charge":"Optimal ✓";
  const rC=rd.readiness<45?"#dc2626":rd.readiness<62?"#d97706":rd.readiness>85?"#16a34a":"#0891b2";
  document.getElementById("app").innerHTML=
    renderHeader()+renderTabs()+renderWeekBar()+`<div class="content">`+
    (view==="today"?renderToday(week,wi,adapt,rd,rC,acwr,acwrC,acwrL):"")+
    (view==="week"?renderWeek(week,wi,adapt,acwr,acwrC,acwrL,rd,rC):"")+
    (view==="overview"?renderOverview():"")+
    (view==="charts"?renderCharts():"")+
    (view==="paces"?renderPaces():"")+
    (view==="export"?renderExport():"")+
    `</div>`;

  if(view==="charts")setTimeout(drawCharts,50);
}

// ── VFC EXPLANATION ──
function renderVFCExplain(rd,vfcBase){
  if(!rd.hasVFC) return `<div class="vfc-explain">ℹ️ <strong>VFC non encore saisie cette semaine</strong> — renseigne ta VFC matinale chaque jour pour activer le score Readiness. Le score affiché est neutre (100/100) tant qu'aucune donnée n'est disponible.</div>`;
  const diff=rd.avgVFC-vfcBase;
  const pct=Math.round((diff/vfcBase)*100);
  const status=pct>5?"✅ Au-dessus de ta baseline":pct>=-5?"🟡 Dans la zone normale (±5%)":pct>=-10?"🟠 Légère baisse (-10%)":pct>=-20?"🔴 Chute significative":"🚨 Chute critique";
  return`<div class="vfc-explain">🫀 <strong>VFC : ${rd.avgVFC}ms</strong> (baseline ${vfcBase}ms · ${pct>0?"+":""}${pct}%) — ${status}<br>Score VFC ${rd.vfcScore}/100 — <em>Formule : ±5% = normal (80-100pts), -10% = attention (60pts), -20% = critique (35pts)</em></div>`;
}

// ── SESSION ENTRY ──

  <span class="zone-badge" style="background:${zone.bg};color:${zone.color};border-color:${zone.color}44">${zone.icon} ${zone.name} — ${zone.garmin}</span>
  <div class="zone-desc"><strong>Bénéfice :</strong> ${zone.benefit}</div>
  ${bpmZone?`<div class="vfc-explain" style="background:${bpmZone.bg};border-color:${bpmZone.color}44;color:${bpmZone.color}">🫀 <strong>FC moyenne ${day.bpmAvg}bpm (${bpmZone.pct}% FCmax)</strong> — Zone : ${bpmZone.name}<br>Bénéfice réalisé : ${bpmZone.benefit}</div>`:""}
  ${day.actualDur!==undefined?`<div class="stat-row">

    ${ss.speed&&(day.type==="run"||day.type==="trail")?`<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe">${ss.speed}km/h · ${paceStr(ss.speed/VMA)}</span>`:""}

  ${steps.map(step=>step.isInfo?`<div class="step" style="opacity:.65"><div class="step-num" style="background:#f1f5f9;color:#64748b;font-size:9px">ℹ</div><div style="flex:1;font-size:11px;color:#64748b">${step.detail}</div></div>`

    <div><div class="flbl" style="display:block;margin-bottom:3px">Fatigue</div><div class="frow" style="margin:0"><input type="range" class="day-field" data-wi="${wi}" data-di="${di}" data-field="fatigue" value="${day.fatigue||2}" min="1" max="5" style="width:80px"><span style="margin-left:4px">${["","😴","😌","😐","😓","🥵"][(day.fatigue||2)-1]} ${day.fatigue||2}/5</span></div></div>
    <div><div class="flbl" style="display:block;margin-bottom:3px">Douleur</div>
      <select class="day-field" data-wi="${wi}" data-di="${di}" data-field="painZone" style="width:100%">${PAIN_ZONES.map(z=>`<option ${(day.painZone||"Aucune")===z?"selected":""}>${z}</option>`).join("")}</select>
      ${day.painZone&&day.painZone!=="Aucune"?`<div class="frow" style="margin-top:4px"><input type="range" class="day-field" data-wi="${wi}" data-di="${di}" data-field="painLevel" value="${day.painLevel||1}" min="1" max="10" style="width:80px"><span style="font-size:11px;font-weight:600;color:${day.painLevel>5?"#dc2626":day.painLevel>3?"#d97706":"#16a34a"}">${day.painLevel||1}/10</span></div>`:""}
    </div>
  </div>
  ${day.type==="bike"&&plan[wi]?.week<=4?`<div class="warn-box">⚠ Biceps fémoral — respecter limite de durée</div>`:""}
  <textarea class="day-field" data-wi="${wi}" data-di="${di}" data-field="comment" placeholder="Notes, ressenti, conditions...">${day.comment||""}</textarea>
  </div>`;
}

// ── CHARTS ──
function renderCharts(){
  return`<h2>Graphiques de progression</h2><div class="qs"><button class="qs-btn" data-view="today">← Aujourd'hui</button></div>
  ${[{id:"chart-km",t:"Km réalisés vs attendus",s:"Clair = planifié · Foncé = réalisé"},{id:"chart-dp",t:"D+ réalisé vs attendu (m)",s:"Trail + vélo"},{id:"chart-min",t:"Minutes réalisées vs attendues",s:"Toutes activités"},{id:"chart-trimp",t:"TRIMP + Readiness",s:"Barres = TRIMP · Courbe = Readiness"},{id:"chart-acwr",t:"Ratio AC:CC",s:"Vert 0.8–1.3 · Orange 1.3–1.5 · Rouge >1.5"},{id:"chart-corr",t:"Sommeil × Motivation × Readiness",s:"Corrélation sur la prépa"}].map(c=>`<div class="chart-wrap"><div class="chart-title">${c.t}</div><div class="chart-sub">${c.s}</div><canvas id="${c.id}" height="165"></canvas></div>`).join("")}`;
}
function ctx2d(c,W,H){const d=window.devicePixelRatio||1;c.width=W*d;c.height=H*d;c.style.width=W+"px";c.style.height=H+"px";const x=c.getContext("2d");x.scale(d,d);return x}
function drawBarChart(canvas,labels,planned,actual,color){
  if(!canvas)return;const W=canvas.parentElement.clientWidth-32,H=165;const ctx=ctx2d(canvas,W,H);
  const pad={t:8,r:6,b:24,l:44};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const max=Math.max(...planned,...actual.filter(v=>v!==null),1)*1.1;const n=labels.length,bW=cW/n*.3;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  [0,.25,.5,.75,1].forEach(f=>{const y=pad.t+cH*(1-f);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle="#94a3b8";ctx.font="9px Inconsolata,monospace";ctx.textAlign="right";ctx.fillText(Math.round(max*f),pad.l-3,y+3)});
  labels.forEach((l,i)=>{const x=pad.l+i*(cW/n)+cW/n*.5;ctx.fillStyle=color+"44";const pH=planned[i]/max*cH;ctx.fillRect(x-bW-1,pad.t+cH-pH,bW,pH);if(actual[i]!==null){const aH=actual[i]/max*cH;ctx.fillStyle=color;ctx.fillRect(x+1,pad.t+cH-aH,bW,aH)}ctx.fillStyle="#94a3b8";ctx.font="8px Inconsolata,monospace";ctx.textAlign="center";ctx.fillText(l,x,H-5)});
}
function drawTRIMPChart(canvas,labels,stats){
  if(!canvas)return;const W=canvas.parentElement.clientWidth-32,H=165;const ctx=ctx2d(canvas,W,H);
  const pad={t:8,r:6,b:24,l:44};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const maxT=Math.max(...stats.map(s=>s.trimp),1)*1.1;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  [0,.25,.5,.75,1].forEach(f=>{const y=pad.t+cH*(1-f);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle="#94a3b8";ctx.font="9px Inconsolata,monospace";ctx.textAlign="right";ctx.fillText(Math.round(maxT*f),pad.l-3,y+3)});
  stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,bW=cW/stats.length*.6,pH=s.trimp/maxT*cH;ctx.fillStyle=(PHASE_C[plan[i].phase]||"#2563eb")+"88";ctx.fillRect(x-bW/2,pad.t+cH-pH,bW,pH);ctx.fillStyle="#94a3b8";ctx.font="8px Inconsolata,monospace";ctx.textAlign="center";ctx.fillText(labels[i],x,H-5)});
  ctx.strokeStyle="#16a34a";ctx.lineWidth=2;ctx.beginPath();stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-s.readiness/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-s.readiness/100);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle="#16a34a";ctx.fill()});
}
function drawACWRChart(canvas,labels,stats){
  if(!canvas)return;const W=canvas.parentElement.clientWidth-32,H=165;const ctx=ctx2d(canvas,W,H);
  const pad={t:8,r:6,b:24,l:36};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;const maxV=2.2;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const z08=pad.t+cH*(1-.8/maxV),z13=pad.t+cH*(1-1.3/maxV),z15=pad.t+cH*(1-1.5/maxV);
  ctx.fillStyle="#f0fdf488";ctx.fillRect(pad.l,z13,cW,z08-z13);ctx.fillStyle="#fffbeb88";ctx.fillRect(pad.l,z15,cW,z13-z15);ctx.fillStyle="#fef2f288";ctx.fillRect(pad.l,pad.t,cW,z15-pad.t);
  [0,.5,1,1.3,1.5,2].forEach(v=>{const y=pad.t+cH*(1-v/maxV);ctx.strokeStyle="#cbd5e1";ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#94a3b8";ctx.font="9px Inconsolata,monospace";ctx.textAlign="right";ctx.fillText(v.toFixed(1),pad.l-3,y+3)});
  ctx.strokeStyle="#2563eb";ctx.lineWidth=2;ctx.setLineDash([]);ctx.beginPath();stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-Math.min(s.acwr,maxV)/maxV);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-Math.min(s.acwr,maxV)/maxV);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle=s.acwr>1.5?"#dc2626":s.acwr>1.3?"#d97706":"#16a34a";ctx.fill();ctx.fillStyle="#94a3b8";ctx.font="8px Inconsolata,monospace";ctx.textAlign="center";ctx.fillText(labels[i],x,H-5)});
}
function drawCorrChart(canvas,labels,stats){
  if(!canvas)return;const W=canvas.parentElement.clientWidth-32,H=165;const ctx=ctx2d(canvas,W,H);
  const pad={t:8,r:105,b:24,l:36};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  [0,.25,.5,.75,1].forEach(f=>{const y=pad.t+cH*(1-f);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle="#94a3b8";ctx.font="9px Inconsolata,monospace";ctx.textAlign="right";ctx.fillText(Math.round(100*f),pad.l-3,y+3)});
  [{label:"Readiness",c:"#16a34a",dash:[],get:s=>s.readiness},{label:"Sommeil",c:"#2563eb",dash:[5,3],get:s=>calcReadiness(plan[s.week-1],vfcBase).sleepScore},{label:"Motivation",c:"#d97706",dash:[2,2],get:s=>calcReadiness(plan[s.week-1],vfcBase).motScore}].forEach((line,li)=>{
    ctx.strokeStyle=line.c;ctx.lineWidth=2;ctx.setLineDash(line.dash);ctx.beginPath();stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-line.get(s)/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();ctx.setLineDash([]);
    stats.forEach((s,i)=>{const x=pad.l+i*(cW/stats.length)+cW/stats.length*.5,y=pad.t+cH*(1-line.get(s)/100);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle=line.c;ctx.fill();ctx.fillStyle="#94a3b8";ctx.font="8px Inconsolata,monospace";ctx.textAlign="center";ctx.fillText(labels[i],x,H-5)});
    const lx=W-pad.r+10,ly=pad.t+li*22;ctx.strokeStyle=line.c;ctx.lineWidth=2;ctx.setLineDash(line.dash);ctx.beginPath();ctx.moveTo(lx,ly+5);ctx.lineTo(lx+16,ly+5);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#334155";ctx.font="10px Inconsolata,monospace";ctx.textAlign="left";ctx.fillText(line.label,lx+20,ly+9);
  });
}
function drawCharts(){const stats=getWeekStats(plan);const labels=stats.map(s=>`S${s.week}`);
  [{id:"chart-km",p:stats.map(s=>s.expKm),a:stats.map(s=>s.actKm),c:"#2563eb"},{id:"chart-dp",p:stats.map(s=>s.expDp),a:stats.map(s=>s.actDp),c:"#d97706"},{id:"chart-min",p:stats.map(s=>s.expMin),a:stats.map(s=>s.actMin),c:"#7c3aed"}].forEach(x=>drawBarChart(document.getElementById(x.id),labels,x.p,x.a,x.c));
  drawTRIMPChart(document.getElementById("chart-trimp"),labels,stats);drawACWRChart(document.getElementById("chart-acwr"),labels,stats);drawCorrChart(document.getElementById("chart-corr"),labels,stats);
}

  <h2>Zones d'entraînement</h2>
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">${TRAINING_ZONES.map(z=>`<div style="background:${z.bg};border:1px solid ${z.color}33;border-left:4px solid ${z.color};border-radius:8px;padding:10px 14px"><div style="font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:${z.color};margin-bottom:3px">${z.icon} ${z.name} — ${z.garmin}</div><div style="font-size:11px;color:var(--text2)">${z.benefit}</div><div style="font-size:10px;color:var(--text3);margin-top:3px">%VMA : ${Math.round(z.pctVMA[0]*100)}-${Math.round(z.pctVMA[1]*100)}%</div></div>`).join("")}</div>
  <div class="card" style="padding:14px 18px;margin-bottom:16px">
    <h3 style="margin-top:0;color:var(--accent)">📊 Comment calibrer ta VFC baseline ?</h3>
    <p style="font-size:12px;color:var(--text2);line-height:1.7">
      <strong>Oui — utilise la moyenne de ta VFC matinale Garmin</strong> sur 4-6 semaines calmes.<br>
      Garmin l'affiche dans le widget "HRV Status" ou l'onglet Santé de Garmin Connect.<br>
      Mesurée chaque matin au réveil, allongé, avant de te lever, pendant 1-2min.<br>
      Sur une période stable (vacances, semaine légère), relève 5-7 valeurs → fais la moyenne.<br><br>
      <strong>Pourquoi le score peut être bas ?</strong><br>

// ── EXPORT ──
function renderExport(){
  const stats=getWeekStats(plan);
  const totAK=+(stats.reduce((s,w)=>s+(w.actKm||0),0)).toFixed(1),totEK=+(stats.reduce((s,w)=>s+w.expKm,0)).toFixed(1);
  const totAD=stats.reduce((s,w)=>s+(w.actDp||0),0),totED=stats.reduce((s,w)=>s+w.expDp,0);
  const totAM=stats.reduce((s,w)=>s+(w.actMin||0),0),totEM=stats.reduce((s,w)=>s+w.expMin,0);
  return`<h2>Export & Données</h2><div style="max-width:580px">
  <div class="card" style="padding:15px 18px;margin-bottom:12px"><h3 style="margin-top:0">📊 Bilan prépa à ce jour</h3>
  ${[{l:"Kilomètres",v:`${totAK}/${totEK}km`,p:totEK>0?Math.round(totAK/totEK*100):0,c:"#2563eb"},{l:"Dénivelé",v:`${totAD}/${totED}m`,p:totED>0?Math.round(totAD/totED*100):0,c:"#d97706"},{l:"Volume",v:`${totAM}/${totEM}min`,p:totEM>0?Math.round(totAM/totEM*100):0,c:"#7c3aed"}].map(r=>`<div class="prog-row"><div class="prog-lbl">${r.l}</div><div class="prog-track"><div class="prog-fill" style="width:${r.p}%;background:${r.c}"></div></div><div class="prog-val" style="color:${r.c}">${r.p}% · ${r.v}</div></div>`).join("")}</div>
  <div class="card" style="padding:15px 18px;margin-bottom:12px"><h3 style="margin-top:0">📁 Fichier HTML autonome</h3><p style="font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:12px">Ouvre dans Chrome/Safari/Firefox. Données sauvegardées automatiquement dans le navigateur (localStorage).</p><button class="export-btn" onclick="dlHTML()">⬇ Télécharger HTML</button></div>
  <div class="card" style="padding:15px 18px"><h3 style="margin-top:0">💾 Transfert & backup</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="export-btn" onclick="dlJSON()">📤 Exporter JSON</button><button class="export-btn" style="background:#16a34a" onclick="document.getElementById('imp').click()">📥 Importer JSON</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importJ(event)"><p style="font-size:11px;color:var(--text3);margin-top:6px">Compatible avec les versions précédentes — tes données existantes sont migrées automatiquement.</p></div>
  </div>`;
}

// ── EVENTS ──
function attachEvents(){
  document.querySelectorAll("[data-view]").forEach(el=>el.addEventListener("click",()=>{view=el.dataset.view;render()}));
  document.querySelectorAll("[data-week]").forEach(el=>el.addEventListener("click",()=>{selWeek=+el.dataset.week;render()}));
  document.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>{selWeek=+el.dataset.goto;view="week";render()}));
  const vb=document.getElementById("vfc-base");
  if(vb)vb.addEventListener("change",()=>{vfcBase=+vb.value;save();render()});
  document.querySelectorAll("[data-swap]").forEach(el=>el.addEventListener("click",()=>{swapOpen=swapOpen===el.dataset.swap?null:el.dataset.swap;render()}));
  document.querySelectorAll("[data-settype]").forEach(el=>el.addEventListener("click",()=>{
    const[wi,di,type]=el.dataset.settype.split(",");
    plan[+wi].days[+di].type=type;plan[+wi].days[+di].activity=ACTIVITY_TYPES[type]?.label||type;
    if(type==="rest")plan[+wi].days[+di].ik="repos";
    swapOpen=null;save();render();
  }));
  document.querySelectorAll(".day-field").forEach(el=>{
    const upd=()=>{const{wi:w,di:d,field:f}=el.dataset;if(w===undefined)return;plan[+w].days[+d][f]=el.type==="range"||el.type==="number"?+el.value:el.value;save();render()};
    el.addEventListener("change",upd);if(el.type==="range")el.addEventListener("input",upd);
  });
}

function dlHTML(){const b=new Blob([document.documentElement.outerHTML],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="MCC_Training_2026.html";a.click()}
function dlJSON(){const b=new Blob([JSON.stringify({plan,vfcBase,date:new Date().toISOString()},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="MCC_data.json";a.click()}
function importJ(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.plan){plan=migrate(d.plan,buildPlan());vfcBase=d.vfcBase||65;save();render();alert("✅ Données importées et migrées !")}}catch(e){alert("Erreur JSON")}};r.readAsText(f)}

render();
</script></body></html>
