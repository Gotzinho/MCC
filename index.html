<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MCC Training">
<meta name="theme-color" content="#0f172a">
<title>MCC 2026 — Training & Planification</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#f0f4f8;--bg2:#e8edf3;--bg3:#dde3eb;--card:#fff;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#0f172a;--text2:#334155;--text3:#64748b;
  --accent:#2563eb;--accent2:#3b82f6;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;--teal:#0891b2;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.05);
  --shadow2:0 2px 8px rgba(15,23,42,.14);
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata',monospace;font-size:13px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* APP SHELL */
#app-header{background:var(--text);color:#fff;padding:calc(var(--safe-top) + 10px) 16px 10px;flex-shrink:0;border-bottom:2px solid var(--accent);position:relative;z-index:20}
#app-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 70px)}
#app-nav{position:fixed;bottom:0;left:0;right:0;background:var(--text);border-top:1px solid #1e293b;padding:6px 0 calc(var(--safe-bottom) + 6px);display:flex;justify-content:space-around;z-index:20}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;border:none;background:none;color:#64748b;font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;transition:color .2s;min-width:52px}
.nav-btn.on{color:var(--accent2)}.nav-btn .nav-icon{font-size:20px;line-height:1}

/* HEADER */
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:1px;color:#fff}
.hdr-sub{font-size:9px;color:#94a3b8;letter-spacing:2px;margin-top:1px}
.cdwn{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--accent2);background:#1e293b;padding:3px 10px;border-radius:20px;letter-spacing:1px;border:1px solid #334155;white-space:nowrap}

/* WEEK SCROLLER */
#week-bar{background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.wbar-i{display:flex;gap:4px;min-width:max-content}
.wp{padding:4px 9px;border-radius:20px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;color:var(--text3)}
.wp.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CARDS & PAGES */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.page{padding:14px 14px;display:none}
.page.active{display:block}

/* METRICS GRID */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.mlbl{font-size:8px;color:var(--text3);letter-spacing:2px;margin-bottom:4px;font-family:'Syne',sans-serif;font-weight:700;text-transform:uppercase}
.mval{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;line-height:1;margin-bottom:2px}
.msub{font-size:10px;color:var(--text3)}

/* READINESS BAR */
.rbar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.rbar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:6px 0}
.rbar-fill{height:100%;border-radius:4px;transition:width .5s}

/* HERO TODAY */
.today-hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);color:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #334155;position:relative;overflow:hidden}

/* SESSION CARD */
.session-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.session-card.intensity-card{border-left:4px solid var(--accent)}
.session-card.rest-card{background:#f8fafc;border-style:dashed;opacity:.8}
.session-card.bonus-card{border:2px dashed var(--accent2);background:#eff6ff}
.session-card.swapped{border-left:4px solid var(--amber)}

/* FORM FIELDS */
.sfield{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.sfield label{font-size:9px;color:var(--text3);letter-spacing:1px;font-family:'Syne',sans-serif;font-weight:700;text-transform:uppercase}
.sfield input,.sfield select,.sfield textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;width:100%}
.sfield input:focus,.sfield select:focus,.sfield textarea:focus{border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}

/* QUICK ENTRY (MODAL PANELS) */
#quick-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:100;backdrop-filter:blur(4px);align-items:flex-end}
#quick-overlay.open{display:flex}
#quick-panel{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
#quick-panel h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:4px}
.q-field{margin-bottom:14px}
.q-label{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;display:block;margin-bottom:6px}
.q-input{width:100%;background:var(--bg2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-family:'Inconsolata',monospace;font-size:18px;font-weight:600;outline:none}
.q-btns{display:flex;gap:8px}
.q-btn{flex:1;padding:12px 6px;border-radius:10px;border:2px solid var(--border);background:var(--bg2);font-size:22px;cursor:pointer;text-align:center}
.q-btn.sel{border-color:var(--accent);background:#eff6ff}
.q-btn span{display:block;font-size:9px;font-family:'Syne',sans-serif;font-weight:700;color:var(--text3);margin-top:3px;letter-spacing:1px}
.q-btn.sel span{color:var(--accent)}
.q-save{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px}
.q-close{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3)}

#fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:16px;width:60px;height:60px;border-radius:50%;background:#2563eb;color:#fff;border:none;font-size:28px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,.5);z-index:99;display:flex;align-items:center;justify-content:center}

.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
canvas{width:100%!important;display:block}
h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;margin-bottom:10px;color:var(--text)}
h3{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;margin-top:12px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;width:100%}
.btn-sm{padding:6px 12px;font-size:10px;width:auto}
.btn-green{background:var(--green)}
.zone-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;margin-bottom:8px;border:1.5px solid}
.zone-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:8px;background:var(--bg2);border-radius:6px;padding:7px 10px;border:1px solid var(--border)}
.ai-panel{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);border-radius:12px;padding:14px;margin-bottom:12px;color:#fff;border:1px solid #334155}
.ai-content{font-size:11px;color:#cbd5e1;line-height:1.7}
.step{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.step-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:9px;font-weight:800;background:var(--bg3);flex-shrink:0}
</style>
</head>
<body>

<div id="app-header">
  <div class="hdr-row">
    <div>
      <div class="hdr-title">⛰️ MCC 2026</div>
      <div class="hdr-sub">40KM · 2350M D+ · 24 AOÛT</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="cdwn" id="cdwn-badge">J-?</div>
    </div>
  </div>
</div>

<div id="week-bar">
  <div class="wbar-i" id="week-pills"></div>
</div>

<div id="app-content">
  <div class="page active" id="page-today">
    <div class="today-hero" id="today-hero"></div>
    <div class="ai-panel" id="ai-panel-today"></div>
    <div class="metrics" id="metrics-today"></div>
    <div id="today-session"></div>
    <div class="card" id="week-mini"></div>
    <div id="past-weeks-section"></div>
  </div>

  <div class="page" id="page-week">
    <div id="week-header"></div>
    <div class="ai-panel" id="ai-panel-week"></div>
    <div class="rbar" id="readiness-bar-week"></div>
    <div class="metrics" id="metrics-week"></div>
    <div id="week-sessions"></div>
  </div>

  <div class="page" id="page-charts">
    <h2>Statistiques d'Entraînement</h2>
    <div class="chart-wrap"><canvas id="chart-km" height="150"></canvas></div>
    <div class="chart-wrap"><canvas id="chart-dp" height="150"></canvas></div>
    <div class="chart-wrap"><canvas id="chart-min" height="150"></canvas></div>
    <div class="chart-wrap"><canvas id="chart-trimp" height="150"></canvas></div>
  </div>

  <div class="page" id="page-settings">
    <h2>Paramètres & Données</h2>
    <div class="card">
      <h3>📊 Profil Physiologique</h3>
      <div class="form-grid">
        <div class="sfield"><label>FC Max (bpm)</label><input type="number" id="s-fcmax"></div>
        <div class="sfield"><label>FC Repos (bpm)</label><input type="number" id="s-fcrepos"></div>
        <div class="sfield"><label>VFC de Base (ms)</label><input type="number" id="s-vfc"></div>
        <div class="sfield"><label>VMA (km/h)</label><input type="number" id="s-vma"></div>
      </div>
      <button class="btn btn-sm" onclick="saveSettings()">💾 Enregistrer</button>
    </div>
    <div class="card">
      <h3>💾 Sauvegarde locale</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="dlJSON()">📤 Exporter Données</button>
        <button class="btn btn-sm btn-green" onclick="document.getElementById('imp').click()">📥 Importer Données</button>
      </div>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJ(event)">
    </div>
    <div class="card">
      <h3>ℹ️ Zones d'Entraînement (Karvonen)</h3>
      <div id="karvonen-zones"></div>
    </div>
  </div>
</div>

<nav id="app-nav">
  <button class="nav-btn on" data-page="today" onclick="showPage('today',this)"><span class="nav-icon">📅</span>AUJOURD'HUI</button>
  <button class="nav-btn" data-page="week" onclick="showPage('week',this)"><span class="nav-icon">📋</span>SEMAINE</button>
  <button class="nav-btn" data-page="charts" onclick="showPage('charts',this)"><span class="nav-icon">📈</span>STATS</button>
  <button class="nav-btn" data-page="settings" onclick="showPage('settings',this)"><span class="nav-icon">⚙️</span>RÉGLAGES</button>
</nav>

<button id="fab" onclick="openQuick()">+</button>

<div id="quick-overlay" onclick="if(event.target===this)closeQuick()">
  <div id="quick-panel">
    <button class="q-close" onclick="closeQuick()">✕</button>
    <h3>⚡ Enregistrement Rapide</h3>
    <div class="q-field">
      <label class="q-label">Durée Réalisée (min)</label>
      <input class="q-input" id="q-dur" type="number" inputmode="numeric">
    </div>
    <div class="q-field">
      <label class="q-label">Distance Réalisée (km)</label>
      <input class="q-input" id="q-km" type="number" inputmode="decimal" step="0.1">
    </div>
    <div class="q-field">
      <label class="q-label">Sensations</label>
      <div class="q-btns">
        <div class="q-btn" id="qf-1" onclick="selectFeel(1)">😓<span>DUR</span></div>
        <div class="q-btn" id="qf-3" onclick="selectFeel(3)">🙂<span>BIEN</span></div>
        <div class="q-btn" id="qf-5" onclick="selectFeel(5)">⚡<span>TOP</span></div>
      </div>
    </div>
    <div class="q-field">
      <label class="q-label">VFC ce matin (ms)</label>
      <input class="q-input" id="q-vfc" type="number">
    </div>
    <button class="q-save" onclick="saveQuick()">💾 Enregistrer</button>
    <div id="q-feedback" style="text-align:center;margin-top:8px;color:var(--green);font-weight:bold"></div>
  </div>
</div>

<script>
// INSTANCIATION DES PARAMÈTRES ET VARIABLES GLOBALES
let settings = JSON.parse(localStorage.getItem('mcc_settings')) || {fcMax:189, fcRepos:45, vfcBase:65, vma:17};
let logs = JSON.parse(localStorage.getItem('mcc_logs')) || {};
let selWeek = 1;
let currentFeel = 3;

const START_DATE = new Date("2026-04-13");
const RACE_DATE = new Date("2026-08-24");
const WEEKS_COUNT = 19;

// BASE DE DONNÉES DU PLAN DE FORMATION (STRUCTURE INTELLIGENTE DU PLAN DE 19 SEMAINES)
const PLAN = [
  { week: 1, targetKm: 35, targetD: 1000, targetMin: 210, phase: "Base" },
  { week: 2, targetKm: 38, targetD: 1200, targetMin: 240, phase: "Base" },
  { week: 3, targetKm: 42, targetD: 1500, targetMin: 280, phase: "Base" },
  { week: 4, targetKm: 30, targetD: 800,  targetMin: 180, phase: "Récupération" },
  { week: 5, targetKm: 45, targetD: 1600, targetMin: 300, phase: "Build" },
  { week: 6, targetKm: 48, targetD: 1800, targetMin: 330, phase: "Build" },
  { week: 7, targetKm: 52, targetD: 2100, targetMin: 360, phase: "Build" },
  { week: 8, targetKm: 35, targetD: 1000, targetMin: 220, phase: "Récupération" },
  { week: 9, targetKm: 55, targetD: 2200, targetMin: 390, phase: "Peak" },
  { week: 10, targetKm: 60, targetD: 2500, targetMin: 420, phase: "Peak" },
  { week: 11, targetKm: 65, targetD: 2800, targetMin: 460, phase: "Peak" },
  { week: 12, targetKm: 40, targetD: 1200, targetMin: 250, phase: "Récupération" },
  { week: 13, targetKm: 70, targetD: 3000, targetMin: 500, phase: "Peak Max" },
  { week: 14, targetKm: 55, targetD: 2000, targetMin: 380, phase: "Taper" },
  { week: 15, targetKm: 45, targetD: 1500, targetMin: 300, phase: "Taper" },
  { week: 16, targetKm: 35, targetD: 1000, targetMin: 220, phase: "Taper" },
  { week: 17, targetKm: 25, targetD: 500,  targetMin: 150, phase: "Affûtage" },
  { week: 18, targetKm: 20, targetD: 300,  targetMin: 110, phase: "Affûtage" },
  { week: 19, targetKm: 40, targetD: 2350, targetMin: 360, phase: "Course (MCC)" }
];

// CALCULS FONCTIONNELS DE TEMPS ET DATES
function getTodayWeek() {
  const diffTime = Math.abs(new Date() - START_DATE);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  return Math.max(1, Math.min(WEEKS_COUNT, Math.ceil(diffDays / 7)));
}

function getDaysLeft() {
  const diff = RACE_DATE - new Date();
  return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
}

// LOGIQUE D'AFFICHAGE ET NAVIGATION DES PAGES
function showPage(pageId, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  
  document.getElementById('page-' + pageId).classList.add('active');
  if(btn) btn.classList.add('on');
  
  if(pageId === 'charts') renderCharts();
  if(pageId === 'week' || pageId === 'today') renderCoreData();
}

// RENDER DE L'APPLICATION ET CALCUL DE READINESS
function renderCoreData() {
  const currentWeek = getTodayWeek();
  document.getElementById('cdwn-badge').innerText = `J-${getDaysLeft()}`;
  
  // Remplissage de la barre de sélections de semaines
  const pills = document.getElementById('week-pills');
  pills.innerHTML = '';
  PLAN.forEach(w => {
    const activeClass = w.week === selWeek ? 'on' : '';
    pills.innerHTML += `<div class="wp ${activeClass}" onclick="selectWeek(${w.week})">S${w.week}</div>`;
  });

  // Injecter données dynamiques de la page principale (Today)
  const weekData = PLAN[selWeek - 1];
  const loggedWeekKm = logs[selWeek]?.km || 0;
  const loggedWeekMin = logs[selWeek]?.dur || 0;

  document.getElementById('today-hero').innerHTML = `
    <h2 style="color:#fff">Semaine ${selWeek} — Phase ${weekData.phase}</h2>
    <p style="opacity:0.9; margin-top:4px">Objectif hebdomadaire : ${weekData.targetKm} km | ${weekData.targetMin} min</p>
  `;

  document.getElementById('metrics-today').innerHTML = `
    <div class="mbox"><div class="mlbl">Volume Réalisé</div><div class="mval">${loggedWeekKm} km</div><div class="msub">Cible: ${weekData.targetKm} km</div></div>
    <div class="mbox"><div class="mlbl">Temps Passé</div><div class="mval">${loggedWeekMin} min</div><div class="msub">Cible: ${weekData.targetMin} min</div></div>
  `;

  // Conseil IA dynamique basé sur l'état physiologique
  const currentVfc = logs['latest_vfc'] || settings.vfcBase;
  let advice = "Indicateurs au vert. Continue de respecter les allures en zones d'endurance fondamentale.";
  if (currentVfc < settings.vfcBase * 0.9) {
    advice = "⚠️ VFC en baisse. Priorise le repos, augmente la durée de sommeil et évite l'intensité aujourd'hui.";
  }
  document.getElementById('ai-panel-today').innerHTML = `
    <div class="ai-content"><strong>💡 Statut & Conseils IA :</strong> ${advice}</div>
  `;
}

function selectWeek(w) {
  selWeek = w;
  renderCoreData();
}

// INTERFACES MODALES & ACTIONS (FAB)
function openQuick() {
  document.getElementById('quick-overlay').classList.add('open');
}
function closeQuick() {
  document.getElementById('quick-overlay').classList.remove('open');
}
function selectFeel(score) {
  currentFeel = score;
  document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('sel'));
  const target = document.getElementById('qf-' + score);
  if(target) target.classList.add('sel');
}

function saveQuick() {
  const dur = parseInt(document.getElementById('q-dur').value) || 0;
  const km = parseFloat(document.getElementById('q-km').value) || 0;
  const vfc = parseInt(document.getElementById('q-vfc').value) || 0;

  if(!logs[selWeek]) logs[selWeek] = { km: 0, dur: 0, vfcHistory: [] };
  
  logs[selWeek].km += km;
  logs[selWeek].dur += dur;
  if(vfc > 0) {
    logs[selWeek].vfcHistory.push(vfc);
    logs['latest_vfc'] = vfc;
  }

  localStorage.setItem('mcc_logs', JSON.stringify(logs));
  
  document.getElementById('q-feedback').innerText = "✅ Séance enregistrée avec succès !";
  setTimeout(() => {
    document.getElementById('q-feedback').innerText = "";
    closeQuick();
    renderCoreData();
  }, 1200);
}

// PARAMÈTRES ET PROFILS PHYSIOLOGIQUES
function saveSettings() {
  settings.fcMax = parseInt(document.getElementById('s-fcmax').value) || settings.fcMax;
  settings.fcRepos = parseInt(document.getElementById('s-fcrepos').value) || settings.fcRepos;
  settings.vfcBase = parseInt(document.getElementById('s-vfc').value) || settings.vfcBase;
  settings.vma = parseFloat(document.getElementById('s-vma').value) || settings.vma;

  localStorage.setItem('mcc_settings', JSON.stringify(settings));
  renderKarvonen();
}

function renderKarvonen() {
  document.getElementById('s-fcmax').value = settings.fcMax;
  document.getElementById('s-fcrepos').value = settings.fcRepos;
  document.getElementById('s-vfc').value = settings.vfcBase;
  document.getElementById('s-vma').value = settings.vma;

  const res = settings.fcMax - settings.fcRepos;
  const zones = [
    { name: "Z1 - Récupération (60%)", bpm: Math.round(settings.fcRepos + 0.6 * res) },
    { name: "Z2 - Endurance Fondamentale (70%)", bpm: Math.round(settings.fcRepos + 0.7 * res) },
    { name: "Z3 - Tempo (80%)", bpm: Math.round(settings.fcRepos + 0.8 * res) },
    { name: "Z4 - Seuil Lactique (90%)", bpm: Math.round(settings.fcRepos + 0.9 * res) }
  ];

  let html = '';
  zones.forEach(z => {
    html += `<div class="zone-desc"><strong>${z.name} :</strong> Cible &le; ${z.bpm} bpm</div>`;
  });
  document.getElementById('karvonen-zones').innerHTML = html;
}

// RENDU DES GRAPHICS (CHART.JS FUSIONNÉ)
let charts = {};
function renderCharts() {
  const labels = PLAN.map(p => 'S' + p.week);
  const targetKmData = PLAN.map(p => p.targetKm);
  const loggedKmData = PLAN.map(p => logs[p.week]?.km || 0);

  if (charts.km) charts.km.destroy();
  
  const ctxKm = document.getElementById('chart-km').getContext('2d');
  charts.km = new Chart(ctxKm, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'Prévu (km)', data: targetKmData, backgroundColor: 'rgba(37, 99, 235, 0.3)' },
        { label: 'Réalisé (km)', data: loggedKmData, backgroundColor: 'rgba(22, 163, 74, 0.9)' }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

// EXPORT / IMPORT JSON
function dlJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({settings, logs}));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "mcc_training_data.json");
  dlAnchor.click();
}

function importJ(e) {
  const reader = new FileReader();
  reader.onload = function(event) {
    const parsed = JSON.parse(event.target.result);
    if(parsed.settings) settings = parsed.settings;
    if(parsed.logs) logs = parsed.logs;
    localStorage.setItem('mcc_settings', JSON.stringify(settings));
    localStorage.setItem('mcc_logs', JSON.stringify(logs));
    renderKarvonen();
    renderCoreData();
  };
  reader.readAsText(e.target.files[0]);
}

// RENDER INITIAL AU CHARGEMENT
window.onload = function() {
  selWeek = getTodayWeek();
  renderKarvonen();
  renderCoreData();
};
</script>
